<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 840" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D0F14"/>
      <stop offset="100%" stop-color="#13151C"/>
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B6FF0"/>
      <stop offset="100%" stop-color="#9D93FF"/>
    </linearGradient>

    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D93FF"/>
      <stop offset="50%" stop-color="#7B6FF0"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C72"/>
      <stop offset="100%" stop-color="#FF8595"/>
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="orbGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="840" rx="36" fill="url(#bgGrad)"/>
  <rect width="400" height="840" rx="36" fill="none" stroke="#2A2D3E" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="32" y="34" fill="#F0F0F5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600">09:41</text>
  <g transform="translate(325, 24)">
    <!-- Signal -->
    <rect x="0" y="7" width="3" height="5" rx="1" fill="#F0F0F5"/>
    <rect x="5" y="5" width="3" height="7" rx="1" fill="#F0F0F5"/>
    <rect x="10" y="2" width="3" height="10" rx="1" fill="#F0F0F5"/>
    <rect x="15" y="0" width="3" height="12" rx="1" fill="#F0F0F5"/>
    <!-- Battery -->
    <rect x="25" y="1" width="20" height="10" rx="2.5" fill="none" stroke="#F0F0F5" stroke-width="1.5"/>
    <rect x="27" y="3" width="14" height="6" rx="1.5" fill="#4ADE80"/>
  </g>

  <!-- App Header -->
  <g transform="translate(20, 54)">
    <text x="0" y="22" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="20" font-weight="700" letter-spacing="-0.4">Good evening, Ishan</text>
    
    <!-- Subtitle & Sync Badge -->
    <text x="0" y="42" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="12" font-weight="500">Saturday, August 29</text>
    
    <!-- Sync Pill -->
    <g transform="translate(130, 31)">
      <rect width="68" height="16" rx="8" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="1"/>
      <circle cx="9" cy="8" r="3" fill="#4ADE80"/>
      <text x="16" y="11.5" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="0.5">ONLINE</text>
    </g>

    <!-- Header Action Buttons -->
    <!-- Search Button -->
    <g transform="translate(280, 8)">
      <rect width="36" height="36" rx="10" fill="#13151C" stroke="#2A2D3E" stroke-width="1"/>
      <circle cx="16" cy="16" r="6" fill="none" stroke="#8A8EA8" stroke-width="1.8"/>
      <line x1="20.5" y1="20.5" x2="25" y2="25" stroke="#8A8EA8" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <!-- Settings Button -->
    <g transform="translate(324, 8)">
      <rect width="36" height="36" rx="10" fill="#13151C" stroke="#2A2D3E" stroke-width="1"/>
      <circle cx="18" cy="18" r="4" fill="none" stroke="#8A8EA8" stroke-width="1.8"/>
      <path d="M18 9v2 M18 25v2 M9 18h2 M25 18h2" stroke="#8A8EA8" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ── 2-PART SPLIT QUICK STATS ── -->
  <g transform="translate(20, 116)">
    <!-- Part 1: Today's Progress (Left 58%) -->
    <g transform="translate(0, 0)">
      <rect width="215" height="86" rx="16" fill="#13151C" stroke="#2A2D3E" stroke-width="1" filter="url(#cardShadow)"/>
      
      <!-- Icon & Label -->
      <g transform="translate(14, 14)">
        <circle cx="7" cy="7" r="7" fill="#7B6FF0" fill-opacity="0.18"/>
        <polyline points="4,7 6.5,9.5 10,4.5" fill="none" stroke="#7B6FF0" stroke-width="1.5" stroke-linecap="round"/>
        <text x="20" y="10.5" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="0.6">TODAY'S TASKS</text>
      </g>

      <!-- Stat Values -->
      <text x="14" y="52" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="20" font-weight="700">4 <tspan font-size="13" font-weight="500" fill="#8A8EA8">Pending</tspan> · 8 <tspan font-size="13" font-weight="500" fill="#4ADE80">Done</tspan></text>
      
      <!-- Progress Bar -->
      <g transform="translate(14, 64)">
        <rect width="187" height="6" rx="3" fill="#1C1F2B"/>
        <rect width="124" height="6" rx="3" fill="url(#primaryGrad)"/>
      </g>
    </g>

    <!-- Part 2: Overdue / Alert Card (Right 38%) -->
    <g transform="translate(225, 0)">
      <rect width="135" height="86" rx="16" fill="#13151C" stroke="#FF5C72" stroke-opacity="0.3" stroke-width="1" filter="url(#cardShadow)"/>
      
      <!-- Warning Icon & Label -->
      <g transform="translate(12, 14)">
        <circle cx="7" cy="7" r="7" fill="#FF5C72" fill-opacity="0.18"/>
        <text x="4.5" y="10.5" fill="#FF5C72" font-family="'Inter', sans-serif" font-size="10" font-weight="800">!</text>
        <text x="20" y="10.5" fill="#FF5C72" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="0.6">OVERDUE</text>
      </g>

      <!-- Overdue Stat Count -->
      <text x="12" y="52" fill="#FF5C72" font-family="'Inter', sans-serif" font-size="22" font-weight="800">2 <tspan font-size="12" font-weight="500" fill="#8A8EA8">Tasks</tspan></text>

      <!-- Action Indicator -->
      <text x="12" y="70" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Tap to review →</text>
    </g>
  </g>

  <!-- ── BENTO ROW 1: URGENT (60%) + VOICE ORB (40%) ── -->
  <g transform="translate(20, 214)">
    <!-- Urgent Cell -->
    <g transform="translate(0, 0)">
      <rect width="215" height="152" rx="18" fill="#13151C" stroke="#2A2D3E" stroke-width="1" filter="url(#cardShadow)"/>
      
      <!-- Cell Title -->
      <g transform="translate(14, 14)">
        <circle cx="4" cy="4" r="3" fill="#FF5C72"/>
        <text x="12" y="7" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.6">URGENT DEADLINES</text>
      </g>

      <!-- Urgent Item 1 -->
      <g transform="translate(14, 38)">
        <rect width="187" height="46" rx="10" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="0.8"/>
        <circle cx="12" cy="23" r="4" fill="#FF5C72"/>
        <text x="24" y="19" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">OS Lab Assignment</text>
        <text x="24" y="34" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="500">Today · 06:00 PM</text>
        <rect x="140" y="14" width="38" height="18" rx="6" fill="#FF5C72" fill-opacity="0.15"/>
        <text x="146" y="26.5" fill="#FF5C72" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700">1h left</text>
      </g>

      <!-- Urgent Item 2 -->
      <g transform="translate(14, 92)">
        <rect width="187" height="46" rx="10" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="0.8"/>
        <circle cx="12" cy="23" r="4" fill="#FF9966"/>
        <text x="24" y="19" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">Review PR #42</text>
        <text x="24" y="34" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="500">Today · 08:30 PM</text>
      </g>
    </g>

    <!-- Orb Cell (Tap to Speak) -->
    <g transform="translate(225, 0)">
      <rect width="135" height="152" rx="18" fill="#13151C" stroke="#7B6FF0" stroke-opacity="0.35" stroke-width="1" filter="url(#cardShadow)"/>
      
      <!-- Outer Glow Ring -->
      <circle cx="67.5" cy="64" r="42" fill="#7B6FF0" fill-opacity="0.08"/>
      <circle cx="67.5" cy="64" r="34" fill="#7B6FF0" fill-opacity="0.16"/>
      
      <!-- Center Glowing Orb -->
      <circle cx="67.5" cy="64" r="26" fill="url(#orbGrad)" filter="url(#orbGlow)"/>
      
      <!-- Mic Icon in Orb -->
      <g transform="translate(60, 56.5)">
        <rect x="4" y="2" width="7" height="10" rx="3.5" fill="#FFFFFF"/>
        <path d="M1.5 6.5C1.5 10 13.5 10 13.5 6.5" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="7.5" y1="12" x2="7.5" y2="15" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
      </g>

      <!-- Label -->
      <text x="67.5" y="122" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.4">TAP TO SPEAK</text>
      <text x="67.5" y="136" fill="#7B6FF0" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">AI Capture</text>
    </g>
  </g>

  <!-- ── BENTO ROW 2: TODAY'S FOCUS ── -->
  <g transform="translate(20, 378)">
    <rect width="360" height="340" rx="20" fill="#13151C" stroke="#2A2D3E" stroke-width="1" filter="url(#cardShadow)"/>
    
    <!-- Section Title & Filter -->
    <g transform="translate(16, 16)">
      <g transform="translate(0, 2)">
        <rect width="14" height="14" rx="4" fill="#7B6FF0" fill-opacity="0.18"/>
        <circle cx="7" cy="7" r="3" fill="#7B6FF0"/>
      </g>
      <text x="22" y="13" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">TODAY'S FOCUS</text>
      <text x="328" y="13" fill="#7B6FF0" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="end">View All</text>
    </g>

    <!-- Task Item 1 -->
    <g transform="translate(16, 46)">
      <rect width="328" height="60" rx="12" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="0.8"/>
      <!-- Checkbox -->
      <rect x="14" y="20" width="20" height="20" rx="6" fill="none" stroke="#7B6FF0" stroke-width="1.8"/>
      <!-- Task Content -->
      <text x="44" y="27" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="12.5" font-weight="600">Implement Drift Database DAOs</text>
      <text x="44" y="44" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500">10:00 AM · Academics</text>
      <!-- Priority Badge -->
      <rect x="264" y="20" width="50" height="20" rx="6" fill="#FF5C72" fill-opacity="0.15"/>
      <text x="289" y="33.5" fill="#FF5C72" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">HIGH</text>
    </g>

    <!-- Task Item 2 -->
    <g transform="translate(16, 114)">
      <rect width="328" height="60" rx="12" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="0.8"/>
      <!-- Checkbox -->
      <rect x="14" y="20" width="20" height="20" rx="6" fill="none" stroke="#7B6FF0" stroke-width="1.8"/>
      <!-- Task Content -->
      <text x="44" y="27" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="12.5" font-weight="600">Compiler Design Lecture Review</text>
      <text x="44" y="44" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500">02:30 PM · Academics</text>
      <!-- Priority Badge -->
      <rect x="264" y="20" width="50" height="20" rx="6" fill="#FF9966" fill-opacity="0.15"/>
      <text x="289" y="33.5" fill="#FF9966" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">MED</text>
    </g>

    <!-- Task Item 3 -->
    <g transform="translate(16, 182)">
      <rect width="328" height="60" rx="12" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="0.8"/>
      <!-- Checkbox -->
      <rect x="14" y="20" width="20" height="20" rx="6" fill="none" stroke="#7B6FF0" stroke-width="1.8"/>
      <!-- Task Content -->
      <text x="44" y="27" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="12.5" font-weight="600">Sync with Internship Mentor</text>
      <text x="44" y="44" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500">04:00 PM · Internship</text>
      <!-- Priority Badge -->
      <rect x="264" y="20" width="50" height="20" rx="6" fill="#7B6FF0" fill-opacity="0.15"/>
      <text x="289" y="33.5" fill="#7B6FF0" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">WORK</text>
    </g>

    <!-- Task Item 4 (Completed) -->
    <g transform="translate(16, 250)">
      <rect width="328" height="60" rx="12" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="0.8" opacity="0.65"/>
      <!-- Checkbox (Checked) -->
      <rect x="14" y="20" width="20" height="20" rx="6" fill="#4ADE80"/>
      <polyline points="18,30 22,34 29,26" fill="none" stroke="#0D0F14" stroke-width="2" stroke-linecap="round"/>
      <!-- Task Content -->
      <text x="44" y="27" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="12.5" font-weight="500" text-decoration="line-through">Morning Quick Voice Check-in</text>
      <text x="44" y="44" fill="#4A4E6A" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500">08:00 AM · Completed</text>
      <!-- Done Badge -->
      <rect x="264" y="20" width="50" height="20" rx="6" fill="#4ADE80" fill-opacity="0.15"/>
      <text x="289" y="33.5" fill="#4ADE80" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">DONE</text>
    </g>
  </g>

  <!-- ── BOTTOM NAVIGATION BAR ── -->
  <g transform="translate(0, 756)">
    <!-- Nav Background -->
    <rect width="400" height="84" fill="#13151C" stroke="#2A2D3E" stroke-width="1"/>
    
    <!-- Tab 1: Home (Active) -->
    <g transform="translate(50, 16)">
      <circle cx="16" cy="16" r="18" fill="#7B6FF0" fill-opacity="0.18"/>
      <!-- Home Icon -->
      <path d="M10 18l6-5 6 5v6a1 1 0 01-1 1h-3v-4h-4v4h-3a1 1 0 01-1-1v-6z" fill="#7B6FF0"/>
      <text x="16" y="46" fill="#7B6FF0" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Home</text>
    </g>

    <!-- Tab 2: Workspaces -->
    <g transform="translate(136, 16)">
      <rect x="7" y="8" width="18" height="16" rx="3" fill="none" stroke="#8A8EA8" stroke-width="1.8"/>
      <line x1="7" y1="13" x2="25" y2="13" stroke="#8A8EA8" stroke-width="1.8"/>
      <text x="16" y="46" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="9" font-weight="500" text-anchor="middle">Workspaces</text>
    </g>

    <!-- Tab 3: Alarms -->
    <g transform="translate(222, 16)">
      <circle cx="16" cy="15" r="8" fill="none" stroke="#8A8EA8" stroke-width="1.8"/>
      <polyline points="16,11 16,15 19,17" fill="none" stroke="#8A8EA8" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="9" y1="8" x2="12" y2="10" stroke="#8A8EA8" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="23" y1="8" x2="20" y2="10" stroke="#8A8EA8" stroke-width="1.8" stroke-linecap="round"/>
      <text x="16" y="46" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="9" font-weight="500" text-anchor="middle">Alarms</text>
    </g>

    <!-- Tab 4: Notes -->
    <g transform="translate(308, 16)">
      <rect x="9" y="7" width="14" height="18" rx="2" fill="none" stroke="#8A8EA8" stroke-width="1.8"/>
      <line x1="13" y1="12" x2="19" y2="12" stroke="#8A8EA8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="13" y1="16" x2="19" y2="16" stroke="#8A8EA8" stroke-width="1.5" stroke-linecap="round"/>
      <text x="16" y="46" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="9" font-weight="500" text-anchor="middle">Notes</text>
    </g>
  </g>
</svg>
