<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 840" width="100%" height="100%">
  <defs>
    <linearGradient id="overlayBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07080B" stop-opacity="0.94"/>
      <stop offset="50%" stop-color="#0D0F14" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#07080B" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="orbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="30%" stop-color="#7B6FF0"/>
      <stop offset="70%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B6FF0" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#7B6FF0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7B6FF0" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadowBox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with Overlay Backdrop Blur Vibe -->
  <rect width="400" height="840" rx="36" fill="url(#overlayBg)"/>
  <rect width="400" height="840" rx="36" fill="none" stroke="#2A2D3E" stroke-width="2"/>

  <!-- Top Close / Dismiss Pill -->
  <g transform="translate(180, 20)">
    <rect width="40" height="5" rx="2.5" fill="#4A4E6A"/>
  </g>

  <!-- Voice Aura Brand Tag -->
  <g transform="translate(140, 52)">
    <rect width="120" height="24" rx="12" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#7B6FF0"/>
    <text x="24" y="16" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="1">AURA VOICE AI</text>
  </g>

  <!-- ── PULSING GLOWING ORB ── -->
  <g transform="translate(200, 210)">
    <!-- Halo Waves -->
    <circle cx="0" cy="0" r="110" fill="url(#haloGlow)"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#7B6FF0" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#C084FC" stroke-opacity="0.4" stroke-width="2"/>

    <!-- Central Glowing Orb Sphere -->
    <circle cx="0" cy="0" r="48" fill="url(#orbGradient)" filter="url(#glowEffect)"/>

    <!-- Dynamic Sound Wave Overlay -->
    <g transform="translate(-18, -12)">
      <rect x="0" y="6" width="4" height="12" rx="2" fill="#FFFFFF"/>
      <rect x="7" y="2" width="4" height="20" rx="2" fill="#FFFFFF"/>
      <rect x="14" y="0" width="4" height="24" rx="2" fill="#FFFFFF"/>
      <rect x="21" y="4" width="4" height="16" rx="2" fill="#FFFFFF"/>
      <rect x="28" y="7" width="4" height="10" rx="2" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ── LIVE TRANSCRIPTION BUBBLE ── -->
  <g transform="translate(30, 330)">
    <text x="170" y="0" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">LISTENING...</text>
    
    <!-- User Voice Transcript Card -->
    <rect y="16" width="340" height="74" rx="16" fill="#13151C" stroke="#2A2D3E" stroke-width="1" filter="url(#shadowBox)"/>
    
    <text x="20" y="46" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="14.5" font-weight="600">"Remind me to submit the OS assignment tomorrow at 5 PM"</text>
    <rect x="238" y="55" width="2" height="15" fill="#7B6FF0"/>
  </g>

  <!-- ── AI INTENT EXTRACTION PREVIEW CARD ── -->
  <g transform="translate(30, 440)">
    <rect width="340" height="230" rx="20" fill="#13151C" stroke="#7B6FF0" stroke-opacity="0.4" stroke-width="1.2" filter="url(#shadowBox)"/>
    
    <!-- Header: Action Detected -->
    <g transform="translate(18, 18)">
      <rect width="26" height="26" rx="8" fill="#7B6FF0" fill-opacity="0.2"/>
      <path d="M13 7v12M7 13l6-6 6 6" fill="none" stroke="#7B6FF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="16" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="12" font-weight="700">AI EXTRACTED INTENT</text>
      <rect x="240" y="2" width="60" height="20" rx="6" fill="#4ADE80" fill-opacity="0.15"/>
      <text x="270" y="15.5" fill="#4ADE80" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">HIGH CONF</text>
    </g>

    <!-- Field 1: Title -->
    <g transform="translate(18, 58)">
      <text x="0" y="12" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">TITLE</text>
      <rect y="18" width="304" height="34" rx="8" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="0.8"/>
      <text x="12" y="39" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="12.5" font-weight="600">Submit Operating Systems Assignment</text>
    </g>

    <!-- Field 2 & 3: Workspace + Schedule Row -->
    <g transform="translate(18, 122)">
      <!-- Workspace Pill -->
      <g transform="translate(0, 0)">
        <text x="0" y="12" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">WORKSPACE</text>
        <rect y="18" width="144" height="34" rx="8" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="0.8"/>
        <circle cx="14" cy="35" r="4" fill="#7B6FF0"/>
        <text x="24" y="39" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Academics</text>
      </g>
      
      <!-- Date/Time Pill -->
      <g transform="translate(156, 0)">
        <text x="0" y="12" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">DUE DATE</text>
        <rect y="18" width="148" height="34" rx="8" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="0.8"/>
        <text x="12" y="39" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Tomorrow · 5:00 PM</text>
      </g>
    </g>

    <!-- Human in the Loop Notice -->
    <g transform="translate(18, 188)">
      <circle cx="6" cy="6" r="5" fill="#22D3EE" fill-opacity="0.2"/>
      <circle cx="6" cy="6" r="2" fill="#22D3EE"/>
      <text x="16" y="9.5" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="500">Tap Confirm to schedule reminder &amp; sync to SQLite</text>
    </g>
  </g>

  <!-- ── ACTION BUTTONS ── -->
  <g transform="translate(30, 690)">
    <!-- Cancel Button -->
    <g transform="translate(0, 0)">
      <rect width="130" height="52" rx="14" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="1.2"/>
      <text x="65" y="32" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Cancel</text>
    </g>

    <!-- Confirm CTA Button -->
    <g transform="translate(142, 0)">
      <rect width="198" height="52" rx="14" fill="#7B6FF0" filter="url(#glowEffect)"/>
      <text x="99" y="32" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Confirm &amp; Save Task</text>
    </g>
  </g>
</svg>
