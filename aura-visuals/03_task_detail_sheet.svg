<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 840" width="100%" height="100%">
  <defs>
    <linearGradient id="sheetBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C1F2B"/>
      <stop offset="100%" stop-color="#13151C"/>
    </linearGradient>

    <filter id="bottomSheetShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="-8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dimmed Parent Screen Background -->
  <rect width="400" height="840" rx="36" fill="#07080B" fill-opacity="0.8"/>

  <!-- ── BOTTOM SHEET CONTAINER ── -->
  <g transform="translate(0, 100)">
    <!-- Sheet Surface with Rounded Top Corners -->
    <rect width="400" height="740" rx="28" fill="url(#sheetBg)" stroke="#2A2D3E" stroke-width="1.5" filter="url(#bottomSheetShadow)"/>
    
    <!-- Drag Handle -->
    <rect x="180" y="12" width="40" height="4.5" rx="2.25" fill="#4A4E6A"/>

    <!-- Header Row -->
    <g transform="translate(24, 34)">
      <text x="0" y="16" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="18" font-weight="700">Edit Task Details</text>
      <!-- Close button -->
      <g transform="translate(320, -4)">
        <circle cx="14" cy="14" r="14" fill="#13151C" stroke="#2A2D3E" stroke-width="1"/>
        <line x1="9" y1="9" x2="19" y2="19" stroke="#8A8EA8" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="19" y1="9" x2="9" y2="19" stroke="#8A8EA8" stroke-width="1.8" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ── FORM FIELDS ── -->

    <!-- Field 1: Task Title -->
    <g transform="translate(24, 76)">
      <text x="0" y="10" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="0.6">TASK TITLE</text>
      <rect y="16" width="352" height="48" rx="12" fill="#13151C" stroke="#7B6FF0" stroke-width="1.4"/>
      <text x="14" y="44" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="13.5" font-weight="600">Submit Operating Systems Assignment</text>
    </g>

    <!-- Field 2: Workspace Selector -->
    <g transform="translate(24, 156)">
      <text x="0" y="10" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="0.6">WORKSPACE</text>
      
      <!-- Workspace Pills Row -->
      <g transform="translate(0, 16)">
        <!-- Pill 1 (Active): Academics -->
        <rect x="0" y="0" width="105" height="32" rx="16" fill="#7B6FF0" fill-opacity="0.2" stroke="#7B6FF0" stroke-width="1.2"/>
        <circle cx="14" cy="16" r="4" fill="#7B6FF0"/>
        <text x="24" y="20" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Academics</text>

        <!-- Pill 2: Internship -->
        <rect x="113" y="0" width="100" height="32" rx="16" fill="#13151C" stroke="#2A2D3E" stroke-width="1"/>
        <circle cx="127" cy="16" r="4" fill="#22D3EE"/>
        <text x="137" y="20" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Internship</text>

        <!-- Pill 3: Personal -->
        <rect x="221" y="0" width="90" height="32" rx="16" fill="#13151C" stroke="#2A2D3E" stroke-width="1"/>
        <circle cx="235" cy="16" r="4" fill="#FF9966"/>
        <text x="245" y="20" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Personal</text>
      </g>
    </g>

    <!-- Field 3: Date & Time Row -->
    <g transform="translate(24, 224)">
      <!-- Date Picker Input -->
      <g transform="translate(0, 0)">
        <text x="0" y="10" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="0.6">DATE</text>
        <rect y="16" width="170" height="44" rx="12" fill="#13151C" stroke="#2A2D3E" stroke-width="1"/>
        <!-- Calendar icon -->
        <rect x="12" y="29" width="16" height="16" rx="3" fill="none" stroke="#7B6FF0" stroke-width="1.4"/>
        <line x1="12" y1="34" x2="28" y2="34" stroke="#7B6FF0" stroke-width="1.4"/>
        <text x="36" y="42" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Tomorrow, Aug 30</text>
      </g>

      <!-- Time Picker Input -->
      <g transform="translate(182, 0)">
        <text x="0" y="10" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="0.6">TIME</text>
        <rect y="16" width="170" height="44" rx="12" fill="#13151C" stroke="#2A2D3E" stroke-width="1"/>
        <!-- Clock icon -->
        <circle cx="20" cy="37" r="7.5" fill="none" stroke="#7B6FF0" stroke-width="1.4"/>
        <polyline points="20,33 20,37 23,39" fill="none" stroke="#7B6FF0" stroke-width="1.4" stroke-linecap="round"/>
        <text x="36" y="42" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="12" font-weight="600">05:00 PM</text>
      </g>
    </g>

    <!-- Field 4: Priority Selector -->
    <g transform="translate(24, 302)">
      <text x="0" y="10" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="0.6">PRIORITY</text>
      
      <g transform="translate(0, 16)">
        <!-- Low -->
        <rect x="0" y="0" width="80" height="32" rx="10" fill="#13151C" stroke="#2A2D3E" stroke-width="1"/>
        <text x="40" y="20" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Low</text>
        
        <!-- Medium -->
        <rect x="88" y="0" width="80" height="32" rx="10" fill="#13151C" stroke="#2A2D3E" stroke-width="1"/>
        <text x="128" y="20" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Medium</text>
        
        <!-- High (Active) -->
        <rect x="176" y="0" width="82" height="32" rx="10" fill="#FF5C72" fill-opacity="0.2" stroke="#FF5C72" stroke-width="1.4"/>
        <text x="217" y="20" fill="#FF5C72" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">High</text>
        
        <!-- Urgent -->
        <rect x="266" y="0" width="86" height="32" rx="10" fill="#13151C" stroke="#2A2D3E" stroke-width="1"/>
        <text x="309" y="20" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Urgent</text>
      </g>
    </g>

    <!-- Field 5: Subtasks Section -->
    <g transform="translate(24, 370)">
      <text x="0" y="10" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="0.6">SUBTASKS (2/3 COMPLETE)</text>
      
      <!-- Subtask 1 (Done) -->
      <g transform="translate(0, 18)">
        <rect width="352" height="36" rx="8" fill="#13151C" stroke="#2A2D3E" stroke-width="0.8"/>
        <rect x="10" y="10" width="16" height="16" rx="4" fill="#4ADE80"/>
        <polyline points="13,18 16,21 21,15" fill="none" stroke="#0D0F14" stroke-width="1.8" stroke-linecap="round"/>
        <text x="34" y="23" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11.5" text-decoration="line-through">Download assignment prompt PDF</text>
      </g>

      <!-- Subtask 2 (Done) -->
      <g transform="translate(0, 60)">
        <rect width="352" height="36" rx="8" fill="#13151C" stroke="#2A2D3E" stroke-width="0.8"/>
        <rect x="10" y="10" width="16" height="16" rx="4" fill="#4ADE80"/>
        <polyline points="13,18 16,21 21,15" fill="none" stroke="#0D0F14" stroke-width="1.8" stroke-linecap="round"/>
        <text x="34" y="23" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11.5" text-decoration="line-through">Write process scheduling simulation code</text>
      </g>

      <!-- Subtask 3 (Pending) -->
      <g transform="translate(0, 102)">
        <rect width="352" height="36" rx="8" fill="#13151C" stroke="#2A2D3E" stroke-width="0.8"/>
        <rect x="10" y="10" width="16" height="16" rx="4" fill="none" stroke="#7B6FF0" stroke-width="1.5"/>
        <text x="34" y="23" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500">Upload code to university portal</text>
      </g>
    </g>

    <!-- Field 6: Notes Area -->
    <g transform="translate(24, 526)">
      <text x="0" y="10" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="0.6">NOTES &amp; OCR CONTEXT</text>
      <rect y="16" width="352" height="60" rx="12" fill="#13151C" stroke="#2A2D3E" stroke-width="1"/>
      <text x="14" y="38" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400">Remember to test round-robin quantum variation 4ms.</text>
    </g>

    <!-- ── FOOTER ACTIONS ── -->
    <g transform="translate(24, 626)">
      <!-- Delete Action -->
      <g transform="translate(0, 0)">
        <rect width="110" height="50" rx="12" fill="#1C1F2B" stroke="#FF5C72" stroke-opacity="0.4" stroke-width="1"/>
        <text x="55" y="30" fill="#FF5C72" font-family="'Inter', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Delete</text>
      </g>

      <!-- Save CTA -->
      <g transform="translate(122, 0)">
        <rect width="230" height="50" rx="12" fill="#7B6FF0"/>
        <text x="115" y="30" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Save Changes</text>
      </g>
    </g>
  </g>
</svg>
