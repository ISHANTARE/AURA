<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 840" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D0F14"/>
      <stop offset="100%" stop-color="#13151C"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="840" rx="36" fill="url(#bgGrad)"/>
  <rect width="400" height="840" rx="36" fill="none" stroke="#2A2D3E" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="32" y="34" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="13" font-weight="600">09:41</text>
  <g transform="translate(325, 24)">
    <rect x="0" y="7" width="3" height="5" rx="1" fill="#F0F0F5"/>
    <rect x="5" y="5" width="3" height="7" rx="1" fill="#F0F0F5"/>
    <rect x="10" y="2" width="3" height="10" rx="1" fill="#F0F0F5"/>
    <rect x="15" y="0" width="3" height="12" rx="1" fill="#F0F0F5"/>
    <rect x="25" y="1" width="20" height="10" rx="2.5" fill="none" stroke="#F0F0F5" stroke-width="1.5"/>
    <rect x="27" y="3" width="14" height="6" rx="1.5" fill="#4ADE80"/>
  </g>

  <!-- Screen Header -->
  <g transform="translate(20, 56)">
    <text x="0" y="20" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">Quick Notes</text>
    <text x="0" y="38" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="12" font-weight="500">Voice-transcribed &amp; manual thoughts</text>
  </g>

  <!-- ── SEARCH BAR & SORT FILTER ── -->
  <g transform="translate(20, 114)">
    <!-- Search Bar -->
    <g transform="translate(0, 0)">
      <rect width="235" height="42" rx="12" fill="#13151C" stroke="#2A2D3E" stroke-width="1"/>
      <!-- Search Icon -->
      <circle cx="18" cy="21" r="5.5" fill="none" stroke="#8A8EA8" stroke-width="1.6"/>
      <line x1="22" y1="25" x2="26" y2="29" stroke="#8A8EA8" stroke-width="1.6" stroke-linecap="round"/>
      <text x="36" y="25.5" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="12" font-weight="500">Search all notes...</text>
    </g>

    <!-- Sort Filter Pill -->
    <g transform="translate(245, 0)">
      <rect width="115" height="42" rx="12" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="1"/>
      <text x="14" y="25.5" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Last Edited ▼</text>
    </g>
  </g>

  <!-- ── NOTES MASONRY / CARDS ── -->

  <!-- Note 1: Pinned Formula / Review (Full Width) -->
  <g transform="translate(20, 172)">
    <rect width="360" height="136" rx="18" fill="#13151C" stroke="#7B6FF0" stroke-opacity="0.3" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Top Row: Pin Badge & Title -->
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="56" height="20" rx="6" fill="#7B6FF0" fill-opacity="0.18"/>
      <text x="28" y="13.5" fill="#7B6FF0" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">★ PINNED</text>
      
      <text x="66" y="15" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Operating Systems Formulas</text>
      <text x="328" y="14" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="500" text-anchor="end">12m ago</text>
    </g>

    <!-- Snippet text -->
    <g transform="translate(16, 48)">
      <text x="0" y="14" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400">1. Turnaround Time = Completion Time - Arrival Time</text>
      <text x="0" y="32" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400">2. Waiting Time = Turnaround Time - Burst Time</text>
      <text x="0" y="50" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400">3. Response Time = First CPU Allocation - Arrival Time</text>
    </g>

    <!-- Workspace Tag -->
    <g transform="translate(16, 106)">
      <circle cx="4" cy="4" r="3" fill="#7B6FF0"/>
      <text x="12" y="7" fill="#7B6FF0" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Academics</text>
    </g>
  </g>

  <!-- Note 2: Internship Meeting Takeaways -->
  <g transform="translate(20, 322)">
    <rect width="360" height="120" rx="18" fill="#13151C" stroke="#2A2D3E" stroke-width="1" filter="url(#cardShadow)"/>
    
    <g transform="translate(16, 16)">
      <text x="0" y="15" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Client Demo Sprint Goals</text>
      <text x="328" y="14" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="500" text-anchor="end">Yesterday</text>
    </g>

    <g transform="translate(16, 44)">
      <text x="0" y="14" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400">• Need to ensure token rate limiter handles 60 RPM.</text>
      <text x="0" y="30" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400">• Prepare mock responses for offline presentation demo.</text>
    </g>

    <g transform="translate(16, 92)">
      <circle cx="4" cy="4" r="3" fill="#22D3EE"/>
      <text x="12" y="7" fill="#22D3EE" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Internship</text>
    </g>
  </g>

  <!-- Note 3: AURA UI Redesign Ideas -->
  <g transform="translate(20, 456)">
    <rect width="360" height="120" rx="18" fill="#13151C" stroke="#2A2D3E" stroke-width="1" filter="url(#cardShadow)"/>
    
    <g transform="translate(16, 16)">
      <text x="0" y="15" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="14" font-weight="700">AURA Design Principles &amp; Themes</text>
      <text x="328" y="14" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="500" text-anchor="end">Aug 26</text>
    </g>

    <g transform="translate(16, 44)">
      <text x="0" y="14" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400">Keep Bento clean: 2-part stats at top, Urgent deadlines,</text>
      <text x="0" y="30" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400">glowing orb capture, and Today's Focus list.</text>
    </g>

    <g transform="translate(16, 92)">
      <circle cx="4" cy="4" r="3" fill="#FF9966"/>
      <text x="12" y="7" fill="#FF9966" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Personal</text>
    </g>
  </g>

  <!-- Note 4: GATE Math Shortcuts -->
  <g transform="translate(20, 590)">
    <rect width="360" height="120" rx="18" fill="#13151C" stroke="#2A2D3E" stroke-width="1" filter="url(#cardShadow)"/>
    
    <g transform="translate(16, 16)">
      <text x="0" y="15" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="14" font-weight="700">GATE Discrete Math Highlights</text>
      <text x="328" y="14" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="500" text-anchor="end">Aug 24</text>
    </g>

    <g transform="translate(16, 44)">
      <text x="0" y="14" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400">Master Theorem cases for divide-and-conquer recurrences:</text>
      <text x="0" y="30" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400">T(n) = aT(n/b) + O(n^d).</text>
    </g>

    <g transform="translate(16, 92)">
      <circle cx="4" cy="4" r="3" fill="#C084FC"/>
      <text x="12" y="7" fill="#C084FC" font-family="'Inter', sans-serif" font-size="10" font-weight="600">IIT Prep</text>
    </g>
  </g>

  <!-- Floating Add Note FAB -->
  <g transform="translate(320, 680)">
    <circle cx="28" cy="28" r="28" fill="#7B6FF0" filter="url(#cardShadow)"/>
    <line x1="28" y1="18" x2="28" y2="38" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="28" x2="38" y2="28" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ── BOTTOM NAVIGATION BAR ── -->
  <g transform="translate(0, 756)">
    <rect width="400" height="84" fill="#13151C" stroke="#2A2D3E" stroke-width="1"/>
    
    <g transform="translate(50, 16)">
      <path d="M10 18l6-5 6 5v6a1 1 0 01-1 1h-3v-4h-4v4h-3a1 1 0 01-1-1v-6z" fill="#8A8EA8"/>
      <text x="16" y="46" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="9" font-weight="500" text-anchor="middle">Home</text>
    </g>

    <g transform="translate(136, 16)">
      <rect x="7" y="8" width="18" height="16" rx="3" fill="none" stroke="#8A8EA8" stroke-width="1.8"/>
      <line x1="7" y1="13" x2="25" y2="13" stroke="#8A8EA8" stroke-width="1.8"/>
      <text x="16" y="46" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="9" font-weight="500" text-anchor="middle">Workspaces</text>
    </g>

    <g transform="translate(222, 16)">
      <circle cx="16" cy="15" r="8" fill="none" stroke="#8A8EA8" stroke-width="1.8"/>
      <polyline points="16,11 16,15 19,17" fill="none" stroke="#8A8EA8" stroke-width="1.8" stroke-linecap="round"/>
      <text x="16" y="46" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="9" font-weight="500" text-anchor="middle">Alarms</text>
    </g>

    <!-- Tab 4: Notes (Active) -->
    <g transform="translate(308, 16)">
      <circle cx="16" cy="16" r="18" fill="#7B6FF0" fill-opacity="0.18"/>
      <rect x="9" y="7" width="14" height="18" rx="2" fill="none" stroke="#7B6FF0" stroke-width="1.8"/>
      <line x1="13" y1="12" x2="19" y2="12" stroke="#7B6FF0" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="13" y1="16" x2="19" y2="16" stroke="#7B6FF0" stroke-width="1.5" stroke-linecap="round"/>
      <text x="16" y="46" fill="#7B6FF0" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Notes</text>
    </g>
  </g>
</svg>
