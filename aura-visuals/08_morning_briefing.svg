<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 840" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D0F14"/>
      <stop offset="100%" stop-color="#13151C"/>
    </linearGradient>

    <!-- Sunrise Gradient Glow for Briefing -->
    <linearGradient id="sunriseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9966"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7B6FF0"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="840" rx="36" fill="url(#bgGrad)"/>
  <rect width="400" height="840" rx="36" fill="none" stroke="#2A2D3E" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="32" y="34" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="13" font-weight="600">07:30</text>
  <g transform="translate(325, 24)">
    <rect x="0" y="7" width="3" height="5" rx="1" fill="#F0F0F5"/>
    <rect x="5" y="5" width="3" height="7" rx="1" fill="#F0F0F5"/>
    <rect x="10" y="2" width="3" height="10" rx="1" fill="#F0F0F5"/>
    <rect x="15" y="0" width="3" height="12" rx="1" fill="#F0F0F5"/>
    <rect x="25" y="1" width="20" height="10" rx="2.5" fill="none" stroke="#F0F0F5" stroke-width="1.5"/>
    <rect x="27" y="3" width="14" height="6" rx="1.5" fill="#4ADE80"/>
  </g>

  <!-- ── SUNRISE BRIEFING HERO HEADER ── -->
  <g transform="translate(20, 56)">
    <rect width="360" height="180" rx="24" fill="#13151C" stroke="url(#sunriseGrad)" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Top Sunrise Tag -->
    <g transform="translate(20, 20)">
      <rect width="118" height="24" rx="12" fill="#FF9966" fill-opacity="0.18"/>
      <circle cx="12" cy="12" r="4" fill="#FF9966"/>
      <text x="24" y="16" fill="#FF9966" font-family="'Inter', sans-serif" font-size="10" font-weight="800">DAILY BRIEFING</text>
    </g>

    <!-- Main Greeting Title -->
    <text x="20" y="80" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">Good Morning, Ishan</text>
    <text x="20" y="104" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="13" font-weight="500">Saturday, August 29 · 28°C Sunny</text>

    <!-- Key Metrics Pills inside Hero -->
    <g transform="translate(20, 126)">
      <rect width="96" height="34" rx="10" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="0.8"/>
      <text x="48" y="21.5" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">5 Tasks Due</text>

      <g transform="translate(104, 0)">
        <rect width="102" height="34" rx="10" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="0.8"/>
        <text x="51" y="21.5" fill="#FF5C72" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">1 High Priority</text>
      </g>

      <g transform="translate(214, 0)">
        <rect width="106" height="34" rx="10" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="0.8"/>
        <text x="53" y="21.5" fill="#4ADE80" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">92% Focus Hr</text>
      </g>
    </g>
  </g>

  <!-- ── AI AUDIO DIGEST PLAY CARD ── -->
  <g transform="translate(20, 252)">
    <rect width="360" height="96" rx="18" fill="#13151C" stroke="#7B6FF0" stroke-opacity="0.3" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Audio Waveform + Play Button -->
    <g transform="translate(16, 20)">
      <circle cx="28" cy="28" r="24" fill="#7B6FF0"/>
      <!-- Play Triangle -->
      <polygon points="25,20 37,28 25,36" fill="#FFFFFF"/>
      
      <text x="64" y="24" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700">Listen to Audio Briefing</text>
      <text x="64" y="42" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">1 min 20 sec · Natural Voice Summary</text>
    </g>
  </g>

  <!-- ── TODAY'S SCHEDULE TIMELINE ── -->
  <g transform="translate(20, 364)">
    <text x="0" y="0" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.6">TODAY'S SCHEDULE</text>
    
    <rect y="12" width="360" height="330" rx="20" fill="#13151C" stroke="#2A2D3E" stroke-width="1" filter="url(#cardShadow)"/>

    <!-- Timeline item 1: 08:30 AM -->
    <g transform="translate(20, 32)">
      <circle cx="6" cy="14" r="5" fill="#7B6FF0"/>
      <line x1="6" y1="24" x2="6" y2="76" stroke="#2A2D3E" stroke-width="1.5"/>
      <text x="24" y="12" fill="#7B6FF0" font-family="'Inter', sans-serif" font-size="11" font-weight="700">08:30 AM</text>
      <text x="24" y="28" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Morning Workout &amp; Nutrition</text>
      <text x="24" y="44" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Personal Life Workspace</text>
    </g>

    <!-- Timeline item 2: 10:00 AM -->
    <g transform="translate(20, 112)">
      <circle cx="6" cy="14" r="5" fill="#FF5C72"/>
      <line x1="6" y1="24" x2="6" y2="76" stroke="#2A2D3E" stroke-width="1.5"/>
      <text x="24" y="12" fill="#FF5C72" font-family="'Inter', sans-serif" font-size="11" font-weight="700">10:00 AM · URGENT</text>
      <text x="24" y="28" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Review OS Scheduling &amp; Complete DAO</text>
      <text x="24" y="44" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Academics Workspace</text>
    </g>

    <!-- Timeline item 3: 03:00 PM -->
    <g transform="translate(20, 192)">
      <circle cx="6" cy="14" r="5" fill="#22D3EE"/>
      <line x1="6" y1="24" x2="6" y2="76" stroke="#2A2D3E" stroke-width="1.5"/>
      <text x="24" y="12" fill="#22D3EE" font-family="'Inter', sans-serif" font-size="11" font-weight="700">03:00 PM</text>
      <text x="24" y="28" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Internship Project Sync Call</text>
      <text x="24" y="44" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Internship Workspace</text>
    </g>

    <!-- Timeline item 4: 07:00 PM -->
    <g transform="translate(20, 272)">
      <circle cx="6" cy="14" r="5" fill="#C084FC"/>
      <text x="24" y="12" fill="#C084FC" font-family="'Inter', sans-serif" font-size="11" font-weight="700">07:00 PM</text>
      <text x="24" y="28" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="13" font-weight="600">GATE Discrete Mathematics Prep</text>
      <text x="24" y="44" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">IIT Prep Workspace</text>
    </g>
  </g>

  <!-- ── BOTTOM CTA: START MY DAY ── -->
  <g transform="translate(20, 726)">
    <rect width="360" height="52" rx="14" fill="#7B6FF0"/>
    <text x="180" y="32" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Open Home Cockpit →</text>
  </g>
</svg>
