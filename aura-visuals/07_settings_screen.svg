<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 840" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D0F14"/>
      <stop offset="100%" stop-color="#13151C"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="840" rx="36" fill="url(#bgGrad)"/>
  <rect width="400" height="840" rx="36" fill="none" stroke="#2A2D3E" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="32" y="34" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="13" font-weight="600">09:41</text>
  <g transform="translate(325, 24)">
    <rect x="0" y="7" width="3" height="5" rx="1" fill="#F0F0F5"/>
    <rect x="5" y="5" width="3" height="7" rx="1" fill="#F0F0F5"/>
    <rect x="10" y="2" width="3" height="10" rx="1" fill="#F0F0F5"/>
    <rect x="15" y="0" width="3" height="12" rx="1" fill="#F0F0F5"/>
    <rect x="25" y="1" width="20" height="10" rx="2.5" fill="none" stroke="#F0F0F5" stroke-width="1.5"/>
    <rect x="27" y="3" width="14" height="6" rx="1.5" fill="#4ADE80"/>
  </g>

  <!-- Top Header with Back Arrow -->
  <g transform="translate(20, 56)">
    <!-- Back Icon -->
    <g transform="translate(0, 4)">
      <circle cx="16" cy="16" r="16" fill="#13151C" stroke="#2A2D3E" stroke-width="1"/>
      <polyline points="18,10 12,16 18,22" fill="none" stroke="#F0F0F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="44" y="26" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="20" font-weight="800">Settings &amp; Theme</text>
  </g>

  <!-- ── SECTION 1: THEME & AESTHETICS ── -->
  <g transform="translate(20, 116)">
    <text x="0" y="0" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.6">APPEARANCE &amp; ACCENTS</text>
    
    <rect y="12" width="360" height="186" rx="18" fill="#13151C" stroke="#2A2D3E" stroke-width="1" filter="url(#cardShadow)"/>

    <!-- Theme Mode (Dark / Light) -->
    <g transform="translate(16, 28)">
      <text x="0" y="16" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Theme Mode</text>
      
      <!-- Segmented Switch (Dark Selected) -->
      <g transform="translate(210, 0)">
        <rect width="118" height="32" rx="16" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="0.8"/>
        <!-- Dark Active Tab -->
        <rect x="2" y="2" width="56" height="28" rx="14" fill="#7B6FF0"/>
        <text x="30" y="20" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Dark</text>
        <text x="86" y="20" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Light</text>
      </g>
    </g>

    <!-- Divider -->
    <line x1="16" y1="76" x2="344" y2="76" stroke="#2A2D3E" stroke-width="1"/>

    <!-- Accent Color Palette Swatches -->
    <g transform="translate(16, 92)">
      <text x="0" y="12" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Primary Accent Glow</text>
      <text x="0" y="28" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="400">Propagates across orbs, cards, badges &amp; buttons</text>

      <!-- 5 Swatches -->
      <g transform="translate(0, 42)">
        <!-- Swatch 1: Indigo (Selected) -->
        <g transform="translate(0, 0)">
          <circle cx="20" cy="20" r="20" fill="#7B6FF0" fill-opacity="0.25"/>
          <circle cx="20" cy="20" r="14" fill="#7B6FF0"/>
          <polyline points="16,20 19,23 25,17" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
          <text x="20" y="48" fill="#7B6FF0" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Indigo</text>
        </g>

        <!-- Swatch 2: Cyber Cyan -->
        <g transform="translate(68, 0)">
          <circle cx="20" cy="20" r="14" fill="#22D3EE"/>
          <text x="20" y="48" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" text-anchor="middle">Cyan</text>
        </g>

        <!-- Swatch 3: Electric Purple -->
        <g transform="translate(136, 0)">
          <circle cx="20" cy="20" r="14" fill="#C084FC"/>
          <text x="20" y="48" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" text-anchor="middle">Purple</text>
        </g>

        <!-- Swatch 4: Sunset Orange -->
        <g transform="translate(204, 0)">
          <circle cx="20" cy="20" r="14" fill="#FF9966"/>
          <text x="20" y="48" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" text-anchor="middle">Orange</text>
        </g>

        <!-- Swatch 5: Rose Gold -->
        <g transform="translate(272, 0)">
          <circle cx="20" cy="20" r="14" fill="#F472B6"/>
          <text x="20" y="48" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" text-anchor="middle">Rose</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ── SECTION 2: AI ENGINE CONFIGURATION ── -->
  <g transform="translate(20, 334)">
    <text x="0" y="0" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.6">AI ENGINE &amp; INTELLIGENCE</text>
    
    <rect y="12" width="360" height="152" rx="18" fill="#13151C" stroke="#2A2D3E" stroke-width="1" filter="url(#cardShadow)"/>

    <!-- Provider Preset -->
    <g transform="translate(16, 26)">
      <text x="0" y="14" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Model Provider</text>
      <text x="0" y="30" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="400">Gemini 2.0 Flash (Free default)</text>
      
      <rect x="238" y="2" width="90" height="28" rx="8" fill="#1C1F2B" stroke="#7B6FF0" stroke-width="1"/>
      <text x="283" y="19.5" fill="#7B6FF0" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Gemini 2.0</text>
    </g>

    <line x1="16" y1="72" x2="344" y2="72" stroke="#2A2D3E" stroke-width="1"/>

    <!-- API Key Status -->
    <g transform="translate(16, 88)">
      <text x="0" y="14" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="13" font-weight="600">API Key Storage</text>
      <text x="0" y="30" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="400">Encrypted in Android Keystore</text>
      
      <rect x="238" y="2" width="90" height="28" rx="8" fill="#4ADE80" fill-opacity="0.15"/>
      <text x="283" y="19.5" fill="#4ADE80" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">● SECURE</text>
    </g>
  </g>

  <!-- ── SECTION 3: SYSTEM PERMISSIONS & SYSTEM OVERLAY ── -->
  <g transform="translate(20, 514)">
    <text x="0" y="0" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.6">SYSTEM &amp; INTEGRATIONS</text>
    
    <rect y="12" width="360" height="152" rx="18" fill="#13151C" stroke="#2A2D3E" stroke-width="1" filter="url(#cardShadow)"/>

    <!-- System Floating Orb Overlay -->
    <g transform="translate(16, 26)">
      <text x="0" y="14" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="13" font-weight="600">System Floating Orb</text>
      <text x="0" y="30" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="400">Access AURA voice capture over any app</text>
      
      <g transform="translate(276, 4)">
        <rect width="52" height="30" rx="15" fill="#7B6FF0"/>
        <circle cx="37" cy="15" r="11" fill="#FFFFFF"/>
      </g>
    </g>

    <line x1="16" y1="72" x2="344" y2="72" stroke="#2A2D3E" stroke-width="1"/>

    <!-- Exact Alarm Hardware Permission -->
    <g transform="translate(16, 88)">
      <text x="0" y="14" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Exact Alarm Scheduling</text>
      <text x="0" y="30" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="400">Hardware precise wakeup timers</text>
      
      <rect x="250" y="2" width="78" height="28" rx="8" fill="#4ADE80" fill-opacity="0.15"/>
      <text x="289" y="19.5" fill="#4ADE80" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">ACTIVE</text>
    </g>
  </g>

  <!-- ── DANGER ZONE / RESET ── -->
  <g transform="translate(20, 694)">
    <rect width="360" height="52" rx="14" fill="#1C1F2B" stroke="#FF5C72" stroke-opacity="0.3" stroke-width="1"/>
    <text x="180" y="31" fill="#FF5C72" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Reset App Data (Full Local Wipe)</text>
  </g>
</svg>
