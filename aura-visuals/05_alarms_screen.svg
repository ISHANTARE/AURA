    </g>

    <g transform="translate(20, 94)">
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="10" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="1"/>
        <text x="10" y="13.5" fill="#4A4E6A" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">M</text>
        <circle cx="34" cy="10" r="10" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="1"/>
        <text x="34" y="13.5" fill="#4A4E6A" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">T</text>
        <circle cx="58" cy="10" r="10" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="1"/>
        <text x="58" y="13.5" fill="#4A4E6A" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">W</text>
        <circle cx="82" cy="10" r="10" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="1"/>
        <text x="82" y="13.5" fill="#4A4E6A" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">T</text>
        <circle cx="106" cy="10" r="10" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="1"/>
        <text x="106" y="13.5" fill="#4A4E6A" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">F</text>
        <circle cx="130" cy="10" r="10" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="1"/>
        <text x="130" y="13.5" fill="#4A4E6A" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">S</text>
        <circle cx="154" cy="10" r="10" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="1"/>
        <text x="154" y="13.5" fill="#4A4E6A" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">S</text>
      </g>

      <g transform="translate(196, -2)">
        <rect width="124" height="26" rx="8" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="0.8"/>
        <circle cx="12" cy="13" r="4" fill="none" stroke="#4A4E6A" stroke-width="1.2"/>
        <text x="24" y="16.5" fill="#4A4E6A" font-family="'Inter', sans-serif" font-size="10" font-weight="500">Gentle Pulse</text>
      </g>
    </g>
  </g>

  <!-- ── BOTTOM NAVIGATION BAR ── -->
  <g transform="translate(0, 756)">
    <rect width="400" height="84" fill="#13151C" stroke="#2A2D3E" stroke-width="1"/>
    
    <!-- Tab 1: Home -->
    <g transform="translate(50, 16)">
      <path d="M10 18l6-5 6 5v6a1 1 0 01-1 1h-3v-4h-4v4h-3a1 1 0 01-1-1v-6z" fill="#8A8EA8"/>
      <text x="16" y="46" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="9" font-weight="500" text-anchor="middle">Home</text>
    </g>

    <!-- Tab 2: Workspaces -->
    <g transform="translate(136, 16)">
      <rect x="7" y="8" width="18" height="16" rx="3" fill="none" stroke="#8A8EA8" stroke-width="1.8"/>
      <line x1="7" y1="13" x2="25" y2="13" stroke="#8A8EA8" stroke-width="1.8"/>
      <text x="16" y="46" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="9" font-weight="500" text-anchor="middle">Workspaces</text>
    </g>

    <!-- Tab 3: Alarms (Active) -->
    <g transform="translate(222, 16)">
      <circle cx="16" cy="16" r="18" fill="#7B6FF0" fill-opacity="0.18"/>
      <circle cx="16" cy="15" r="8" fill="none" stroke="#7B6FF0" stroke-width="1.8"/>
      <polyline points="16,11 16,15 19,17" fill="none" stroke="#7B6FF0" stroke-width="1.8" stroke-linecap="round"/>
      <text x="16" y="46" fill="#7B6FF0" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Alarms</text>
    </g>

    <!-- Tab 4: Notes -->
    <g transform="translate(308, 16)">
      <rect x="9" y="7" width="14" height="18" rx="2" fill="none" stroke="#8A8EA8" stroke-width="1.8"/>
      <text x="16" y="46" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="9" font-weight="500" text-anchor="middle">Notes</text>
    </g>
  </g>
</svg>
