<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 840" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D0F14"/>
      <stop offset="100%" stop-color="#13151C"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="840" rx="36" fill="url(#bgGrad)"/>
  <rect width="400" height="840" rx="36" fill="none" stroke="#2A2D3E" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="32" y="34" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="13" font-weight="600">09:41</text>
  <g transform="translate(325, 24)">
    <rect x="0" y="7" width="3" height="5" rx="1" fill="#F0F0F5"/>
    <rect x="5" y="5" width="3" height="7" rx="1" fill="#F0F0F5"/>
    <rect x="10" y="2" width="3" height="10" rx="1" fill="#F0F0F5"/>
    <rect x="15" y="0" width="3" height="12" rx="1" fill="#F0F0F5"/>
    <rect x="25" y="1" width="20" height="10" rx="2.5" fill="none" stroke="#F0F0F5" stroke-width="1.5"/>
    <rect x="27" y="3" width="14" height="6" rx="1.5" fill="#4ADE80"/>
  </g>

  <!-- Screen Header -->
  <g transform="translate(20, 56)">
    <text x="0" y="20" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">Alarms &amp; Timers</text>
    <text x="0" y="38" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="12" font-weight="500">Exact hardware alarms with background wakeup</text>

    <!-- + Add Alarm Button -->
    <g transform="translate(260, 4)">
      <rect width="100" height="34" rx="10" fill="#7B6FF0"/>
      <text x="50" y="21.5" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">+ Add</text>
    </g>
  </g>

  <!-- ── EXACT ALARM DIAGNOSTICS BANNER ── -->
  <g transform="translate(20, 114)">
    <rect width="360" height="38" rx="12" fill="#1C1F2B" stroke="#4ADE80" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="20" cy="19" r="6" fill="#4ADE80" fill-opacity="0.2"/>
    <circle cx="20" cy="19" r="3" fill="#4ADE80"/>
    <text x="34" y="23" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Exact Alarm Permission: <tspan fill="#4ADE80">Granted &amp; Active</tspan></text>
  </g>

  <!-- ── ALARM CARDS ── -->

  <!-- Alarm 1: 06:30 AM (Active) -->
  <g transform="translate(20, 166)">
    <rect width="360" height="150" rx="20" fill="#13151C" stroke="#7B6FF0" stroke-opacity="0.35" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Time & Switch Row -->
    <g transform="translate(20, 20)">
      <text x="0" y="36" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="36" font-weight="800">06:30 <tspan font-size="16" font-weight="600" fill="#7B6FF0">AM</tspan></text>
      
      <!-- Label -->
      <text x="0" y="58" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Morning Workout &amp; Study</text>

      <!-- Switch ON -->
      <g transform="translate(268, 8)">
        <rect width="52" height="30" rx="15" fill="#7B6FF0"/>
        <circle cx="37" cy="15" r="11" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Days Chips & Sound Selector -->
    <g transform="translate(20, 94)">
      <!-- Weekday Chips (Mon - Fri active) -->
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="10" fill="#7B6FF0"/>
        <text x="10" y="13.5" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">M</text>

        <circle cx="34" cy="10" r="10" fill="#7B6FF0"/>
        <text x="34" y="13.5" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">T</text>

        <circle cx="58" cy="10" r="10" fill="#7B6FF0"/>
        <text x="58" y="13.5" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">W</text>

        <circle cx="82" cy="10" r="10" fill="#7B6FF0"/>
        <text x="82" y="13.5" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">T</text>

        <circle cx="106" cy="10" r="10" fill="#7B6FF0"/>
        <text x="106" y="13.5" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">F</text>

        <circle cx="130" cy="10" r="10" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="1"/>
        <text x="130" y="13.5" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">S</text>

        <circle cx="154" cy="10" r="10" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="1"/>
        <text x="154" y="13.5" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">S</text>
      </g>

      <!-- Sound Pill -->
      <g transform="translate(196, -2)">
        <rect width="124" height="26" rx="8" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="0.8"/>
        <!-- Bell Icon -->
        <circle cx="12" cy="13" r="4" fill="none" stroke="#7B6FF0" stroke-width="1.2"/>
        <text x="24" y="16.5" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="500">Aurora Chime</text>
      </g>
    </g>
  </g>

  <!-- Alarm 2: 08:15 AM (Active) -->
  <g transform="translate(20, 330)">
    <rect width="360" height="150" rx="20" fill="#13151C" stroke="#2A2D3E" stroke-width="1" filter="url(#cardShadow)"/>
    
    <g transform="translate(20, 20)">
      <text x="0" y="36" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="36" font-weight="800">08:15 <tspan font-size="16" font-weight="600" fill="#7B6FF0">AM</tspan></text>
      <text x="0" y="58" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">College Departure</text>

