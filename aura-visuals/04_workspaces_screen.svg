<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 840" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D0F14"/>
      <stop offset="100%" stop-color="#13151C"/>
    </linearGradient>

    <linearGradient id="academicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B6FF0"/>
      <stop offset="100%" stop-color="#9D93FF"/>
    </linearGradient>

    <linearGradient id="internGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>

    <linearGradient id="prepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>

    <linearGradient id="personalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9966"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="840" rx="36" fill="url(#bgGrad)"/>
  <rect width="400" height="840" rx="36" fill="none" stroke="#2A2D3E" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="32" y="34" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="13" font-weight="600">09:41</text>
  <g transform="translate(325, 24)">
    <rect x="0" y="7" width="3" height="5" rx="1" fill="#F0F0F5"/>
    <rect x="5" y="5" width="3" height="7" rx="1" fill="#F0F0F5"/>
    <rect x="10" y="2" width="3" height="10" rx="1" fill="#F0F0F5"/>
    <rect x="15" y="0" width="3" height="12" rx="1" fill="#F0F0F5"/>
    <rect x="25" y="1" width="20" height="10" rx="2.5" fill="none" stroke="#F0F0F5" stroke-width="1.5"/>
    <rect x="27" y="3" width="14" height="6" rx="1.5" fill="#4ADE80"/>
  </g>

  <!-- Screen Header -->
  <g transform="translate(20, 56)">
    <text x="0" y="20" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">Workspaces</text>
    <text x="0" y="38" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="12" font-weight="500">4 active life domains</text>

    <!-- + Add Workspace Button -->
    <g transform="translate(260, 4)">
      <rect width="100" height="34" rx="10" fill="#7B6FF0"/>
      <text x="50" y="21.5" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">+ New</text>
    </g>
  </g>

  <!-- ── WORKSPACE CARDS GRID ── -->
  
  <!-- Workspace 1: Academics (BTech CSE, VIT) -->
  <g transform="translate(20, 120)">
    <rect width="360" height="128" rx="18" fill="#13151C" stroke="#7B6FF0" stroke-opacity="0.3" stroke-width="1" filter="url(#cardShadow)"/>
    
    <!-- Top Row: Icon + Name + Badge -->
    <g transform="translate(16, 16)">
      <circle cx="18" cy="18" r="18" fill="#7B6FF0" fill-opacity="0.18"/>
      <!-- Book Icon -->
      <path d="M11 13h5a2 2 0 012 2v8a2 2 0 00-2-2h-5v-8z M25 13h-5a2 2 0 00-2 2v8a2 2 0 012-2h5v-8z" fill="none" stroke="#7B6FF0" stroke-width="1.6"/>
      <text x="46" y="16" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="15" font-weight="700">Academics</text>
      <text x="46" y="31" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">BTech CSE Coursework &amp; Labs</text>

      <rect x="250" y="6" width="68" height="24" rx="8" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="0.8"/>
      <text x="284" y="21.5" fill="#7B6FF0" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">14 Tasks</text>
    </g>

    <!-- Stats & Progress -->
    <g transform="translate(16, 76)">
      <text x="0" y="12" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">8 Completed · 6 In Progress</text>
      <text x="328" y="12" fill="#7B6FF0" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="end">57%</text>
      <rect y="20" width="328" height="6" rx="3" fill="#1C1F2B"/>
      <rect y="20" width="186" height="6" rx="3" fill="url(#academicGrad)"/>
    </g>
  </g>

  <!-- Workspace 2: Internship (AI Developer) -->
  <g transform="translate(20, 264)">
    <rect width="360" height="128" rx="18" fill="#13151C" stroke="#22D3EE" stroke-opacity="0.3" stroke-width="1" filter="url(#cardShadow)"/>
    
    <g transform="translate(16, 16)">
      <circle cx="18" cy="18" r="18" fill="#22D3EE" fill-opacity="0.18"/>
      <!-- Code/Briefcase Icon -->
      <rect x="11" y="12" width="14" height="12" rx="2.5" fill="none" stroke="#22D3EE" stroke-width="1.6"/>
      <path d="M15 12V10a1 1 0 011-1h4a1 1 0 011 1v2" fill="none" stroke="#22D3EE" stroke-width="1.4"/>
      <text x="46" y="16" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="15" font-weight="700">Internship</text>
      <text x="46" y="31" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Deliverables, Standups &amp; Reviews</text>

      <rect x="250" y="6" width="68" height="24" rx="8" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="0.8"/>
      <text x="284" y="21.5" fill="#22D3EE" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">8 Tasks</text>
    </g>

    <g transform="translate(16, 76)">
      <text x="0" y="12" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">6 Completed · 2 In Progress</text>
      <text x="328" y="12" fill="#22D3EE" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="end">75%</text>
      <rect y="20" width="328" height="6" rx="3" fill="#1C1F2B"/>
      <rect y="20" width="246" height="6" rx="3" fill="url(#internGrad)"/>
    </g>
  </g>

  <!-- Workspace 3: IIT Prep -->
  <g transform="translate(20, 408)">
    <rect width="360" height="128" rx="18" fill="#13151C" stroke="#C084FC" stroke-opacity="0.3" stroke-width="1" filter="url(#cardShadow)"/>
    
    <g transform="translate(16, 16)">
      <circle cx="18" cy="18" r="18" fill="#C084FC" fill-opacity="0.18"/>
      <!-- Target/Goal Icon -->
      <circle cx="18" cy="18" r="8" fill="none" stroke="#C084FC" stroke-width="1.6"/>
      <circle cx="18" cy="18" r="3" fill="#C084FC"/>
      <text x="46" y="16" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="15" font-weight="700">IIT Prep</text>
      <text x="46" y="31" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">GATE &amp; Advanced Algorithms</text>

      <rect x="250" y="6" width="68" height="24" rx="8" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="0.8"/>
      <text x="284" y="21.5" fill="#C084FC" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">22 Tasks</text>
    </g>

    <g transform="translate(16, 76)">
      <text x="0" y="12" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">10 Completed · 12 In Progress</text>
      <text x="328" y="12" fill="#C084FC" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="end">45%</text>
      <rect y="20" width="328" height="6" rx="3" fill="#1C1F2B"/>
      <rect y="20" width="148" height="6" rx="3" fill="url(#prepGrad)"/>
    </g>
  </g>

  <!-- Workspace 4: Personal Life -->
  <g transform="translate(20, 552)">
    <rect width="360" height="128" rx="18" fill="#13151C" stroke="#FF9966" stroke-opacity="0.3" stroke-width="1" filter="url(#cardShadow)"/>
    
    <g transform="translate(16, 16)">
      <circle cx="18" cy="18" r="18" fill="#FF9966" fill-opacity="0.18"/>
      <!-- User / Heart Icon -->
      <circle cx="18" cy="15" r="4.5" fill="none" stroke="#FF9966" stroke-width="1.6"/>
      <path d="M12 24c0-3.3 2.7-6 6-6s6 2.7 6 6" fill="none" stroke="#FF9966" stroke-width="1.6"/>
      <text x="46" y="16" fill="#F0F0F5" font-family="'Inter', sans-serif" font-size="15" font-weight="700">Personal</text>
      <text x="46" y="31" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Health, Fitness &amp; Habits</text>

      <rect x="250" y="6" width="68" height="24" rx="8" fill="#1C1F2B" stroke="#2A2D3E" stroke-width="0.8"/>
      <text x="284" y="21.5" fill="#FF9966" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">6 Tasks</text>
    </g>

    <g transform="translate(16, 76)">
      <text x="0" y="12" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">5 Completed · 1 In Progress</text>
      <text x="328" y="12" fill="#FF9966" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="end">83%</text>
      <rect y="20" width="328" height="6" rx="3" fill="#1C1F2B"/>
      <rect y="20" width="272" height="6" rx="3" fill="url(#personalGrad)"/>
    </g>
  </g>

  <!-- ── BOTTOM NAVIGATION BAR ── -->
  <g transform="translate(0, 756)">
    <rect width="400" height="84" fill="#13151C" stroke="#2A2D3E" stroke-width="1"/>
    
    <!-- Tab 1: Home -->
    <g transform="translate(50, 16)">
      <path d="M10 18l6-5 6 5v6a1 1 0 01-1 1h-3v-4h-4v4h-3a1 1 0 01-1-1v-6z" fill="#8A8EA8"/>
      <text x="16" y="46" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="9" font-weight="500" text-anchor="middle">Home</text>
    </g>

    <!-- Tab 2: Workspaces (Active) -->
    <g transform="translate(136, 16)">
      <circle cx="16" cy="16" r="18" fill="#7B6FF0" fill-opacity="0.18"/>
      <rect x="7" y="8" width="18" height="16" rx="3" fill="none" stroke="#7B6FF0" stroke-width="1.8"/>
      <line x1="7" y1="13" x2="25" y2="13" stroke="#7B6FF0" stroke-width="1.8"/>
      <text x="16" y="46" fill="#7B6FF0" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Workspaces</text>
    </g>

    <!-- Tab 3: Alarms -->
    <g transform="translate(222, 16)">
      <circle cx="16" cy="15" r="8" fill="none" stroke="#8A8EA8" stroke-width="1.8"/>
      <polyline points="16,11 16,15 19,17" fill="none" stroke="#8A8EA8" stroke-width="1.8" stroke-linecap="round"/>
      <text x="16" y="46" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="9" font-weight="500" text-anchor="middle">Alarms</text>
    </g>

    <!-- Tab 4: Notes -->
    <g transform="translate(308, 16)">
      <rect x="9" y="7" width="14" height="18" rx="2" fill="none" stroke="#8A8EA8" stroke-width="1.8"/>
      <text x="16" y="46" fill="#8A8EA8" font-family="'Inter', sans-serif" font-size="9" font-weight="500" text-anchor="middle">Notes</text>
    </g>
  </g>
</svg>
