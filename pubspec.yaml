name: aura
description: "AURA - AI-Unified Reality Assistant"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Database & Storage
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Environment & Security
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.2

  # Networking & AI
  http: ^1.2.1
  connectivity_plus: ^6.0.3
  url_launcher: ^6.3.0

  # Notifications & Timezones
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.2
  flutter_timezone: ^3.0.1

  # Permissions & Hardware
  permission_handler: ^11.3.1

  # ML & OCR
  google_mlkit_text_recognition: ^0.13.0

  # Design & Typography
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0

  # Utilities
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/icons/
